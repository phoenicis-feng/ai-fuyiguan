{{ define "main" }}
  <section class="section">
    <div class="container">
      <h1 class="section__title" style="font-size:1.6rem;">{{ .Title }}</h1>
      <div class="article-listing">
        {{- range .Pages }}
          {{ partial "post-card.html" . }}
        {{- end }}
      </div>
    </div>
  </section>
{{ end }}
