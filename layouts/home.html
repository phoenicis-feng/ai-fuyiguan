{{ define "main" }}
<style>body{font-family:system-ui,-apple-system,sans-serif;color:#e2e8f0;background:#0b1020;line-height:1.6}a{color:#9aa0a8}</style>
<link rel="stylesheet" href="/css/theme-full.css">
<section class="section">
    <div class="container">
      {{ .Content }}
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div class="article-listing">
        {{ range where site.RegularPages "Section" "in" site.Params.mainSections }}
          {{ partial "post-card.html" . }}
        {{ end }}
      </div>
    </div>
  </section>
{{ end }}
