baseURL = "https://ai.corret.xyz/"
title = "AI弗一观"
theme = "hugo-liftoff"
enableRobotsTXT = true
enableEmoji = false
defaultContentLanguage = "zh-cn"

[pagination]
  pagerSize = 6

[params]
  description = "AI测评  AI资讯，人工智能"
  tagline = "AI弗一观 — 测评与资讯"
  copyrightOwner = "AI弗一观"
  copyrightSuffix = "All rights reserved."
  showFullContent = false
  mainSections = ["news", "test"]
  readingTimePerPage = 100

  [[params.categoriesGroups]]
    identifier = "ai-zixun"
    name = "AI资讯"
    items = ["大模型", "AI Agent", "AI编程", "AI生图", "AI视频", "AI研究"]
  [[params.categoriesGroups]]
    identifier = "ai-ceping"
    name = "AI测评"
    items = ["大模型评测", "AI编程评测", "AI工具评测", "Benchmark"]
  [[params.categoriesGroups]]
    name = "AI工具"
    items = ["AI写作", "AI编程", "AI生图", "AI视频", "AI Agent"]
  [[params.categoriesGroups]]
    name = "AI模型"
    items = ["GPT", "Claude", "Gemini", "DeepSeek", "开源模型"]

[params.footer]
  address = ""

[menus]
  [[menus.main]]
    identifier = "home"
    name = "主页"
    pageRef = "/"
    weight = 5
  [[menus.main]]
    name = "AI资讯"
    pageRef = "/news"
    weight = 10
  [[menus.main]]
    name = "AI测评"
    pageRef = "/test"
    weight = 15

[markup]
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3
    ordered = false
  [markup.highlight]
    style = "github-dark"
    noClasses = true
    lineNos = false
    codeFences = true
    tabWidth = 2
  [markup.goldmark.renderer]
    unsafe = true
    autoHeadingID = true


